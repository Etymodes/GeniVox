name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime library
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bootstrap base install and verify with Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\bootstrap_windows.ps1
      - name: Bootstrap again with development dependencies
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\bootstrap_windows.ps1 -WithDev
      - name: Lint
        shell: cmd
        run: .venv\Scripts\python.exe -m ruff check .
      - name: Test and Qt offscreen smoke
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python.exe -m pytest
